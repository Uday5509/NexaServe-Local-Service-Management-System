{% extends "base.html" %}{% block title %}Create account{% endblock %}{% block content %}<section class="auth-wrap"><div class="form-panel auth-panel"><div class="text-center mb-4"><div class="auth-icon"><i class="bi bi-person-plus"></i></div><h2 class="fw-bold mt-3">Create your account</h2><p class="text-secondary">Start booking trusted local services.</p></div><form method="post"><div class="mb-3"><label class="form-label">Full name</label><input class="form-control" name="name" required></div><div class="mb-3"><label class="form-label">Email address</label><input class="form-control" type="email" name="email" required></div><div class="mb-4"><label class="form-label">Password</label><input class="form-control" type="password" name="password" minlength="6" required><div class="form-text">At least 6 characters.</div></div><button class="btn btn-primary w-100 rounded-pill">Create account</button></form><p class="text-center small mt-4 mb-0">Already registered? <a href="{{ url_for('login') }}">Log in</a></p></div></section>{% endblock %}
