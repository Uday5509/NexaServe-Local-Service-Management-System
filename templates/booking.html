{% extends "base.html" %}{% block title %}Book {{ service.title }}{% endblock %}
{% block content %}<section class="container py-5"><div class="row justify-content-center"><div class="col-lg-8"><a href="{{ url_for('services') }}" class="text-decoration-none small"><i class="bi bi-arrow-left"></i> Back to services</a><div class="form-panel mt-3"><div class="service-icon mb-3"><i class="bi {{ service.icon }}"></i></div><div class="eyebrow">BOOK A SERVICE</div><h2 class="fw-bold mt-2">{{ service.title }}</h2><p class="text-secondary">{{ service.description }}</p><div class="booking-price mb-4">Starting at <strong>₹{{ service.price }}</strong></div><form method="post"><div class="mb-3"><label class="form-label">Preferred date</label><input class="form-control" type="date" name="booking_date" min="{{ today }}" required></div><div class="mb-3"><label class="form-label">Service address</label><textarea class="form-control" name="address" rows="2" placeholder="House no., street, area, city" required></textarea></div><div class="mb-4"><label class="form-label">Additional details <span class="text-muted">(optional)</span></label><textarea class="form-control" name="notes" rows="3" placeholder="Tell us a little more about what you need"></textarea></div><button class="btn btn-primary rounded-pill px-4 w-100">Submit booking request</button></form></div></div></div></section>{% endblock %}
